<style>
:root{
  /* Monext brand: slate wordmark, deep-cyan to lime ribbon. Layout: top bar + one working screen; billing = cart left, total rail right */
  --ink:#1E272B; --slate:#3A4248; --muted:#58656A; --line:#DCE4E2; --paper:#F3F6F5; --surface:#FFFFFF;
  --teal:#00897B; --teal-d:#00695C; --teal-soft:#E0F4F0; --cyan:#00BFA5; --lime:#76FF03; --electric:#1DE9B6;
  --grad:linear-gradient(115deg,#2D6B7C 0%,#38A894 48%,#9BE63E 100%);
  --good:#1B7F3B; --good-soft:#E3F3E7; --warn:#995200; --warn-soft:#FFF1DA; --bad:#B42318; --bad-soft:#FCE8E6;
  --display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --font:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;text-wrap:balance}

/* top bar */
.top{position:relative;display:flex;align-items:center;gap:18px;height:56px;padding:0 16px;background:var(--surface);flex:none}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grad)}
.brand{display:flex;align-items:center;gap:8px;color:var(--slate);text-decoration:none;white-space:nowrap}
.brand img{height:28px;width:auto;display:block}
.brand b{font:800 18px/1 var(--display);letter-spacing:.02em}
.brand small{font-weight:500;color:var(--muted);border-left:1px solid var(--line);padding-left:10px;margin-left:4px;font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:7px 11px;border-radius:7px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
nav a:hover{background:var(--paper);color:var(--ink)}
nav a[aria-current=page]{background:var(--slate);color:#fff}
.status{display:flex;gap:8px;align-items:center;flex:none}
.who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;font-size:12px;color:var(--muted)}
.who b{color:var(--ink);font-size:13px}
main{flex:1;min-height:0;overflow:auto}
main.fixed{overflow:hidden}

/* generic */
.view{padding:20px;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vh h1{margin:0;font-size:22px;font-weight:700;color:var(--slate)}
.vh p{margin:2px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:38px;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#A9B8B4}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d)}
.btn.dark{background:var(--slate);border-color:var(--slate);color:#fff}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
.btn.link{border-color:transparent;background:none;color:var(--teal-d);padding-left:6px;padding-right:6px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.42;cursor:not-allowed}
kbd{font:500 11px var(--mono);padding:0 5px;border:1px solid currentColor;border-radius:4px;opacity:.65}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--paper);color:var(--muted);white-space:nowrap;border:0}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--teal-soft);color:var(--teal-d)}
button.chip{cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.panel-h h2{margin:0;font-size:15px;font-weight:700;color:var(--slate)}
.panel-b{padding:16px}
.scroll-x{overflow-x:auto}
.t{width:100%;border-collapse:collapse}
.t th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:1}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:#F8FAF9}
.t tfoot td{font-weight:700;border-top:2px solid var(--line);padding:10px 12px}
.sub{display:block;font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12px;color:var(--muted);font-weight:500}
.kpi b{font:700 23px/1.25 var(--display);font-variant-numeric:tabular-nums;color:var(--slate)}
.kpi small{color:var(--muted)}

  .paybar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;gap:10px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid #DCE5E2;box-shadow:0 -8px 24px rgba(30,39,43,.08)}
  .pb-bill{flex:none;display:flex;flex-direction:column;align-items:flex-start;border:1px solid #D3DEDA;background:#fff;border-radius:12px;padding:6px 12px;min-height:52px;justify-content:center;cursor:pointer}
  .pb-bill b{font-size:14px}
  .pb-bill small{color:var(--teal-d);font-weight:600;font-size:11.5px}
  .pb-total{flex:1;min-width:0;text-align:right;line-height:1.1}
  .pb-total small{display:block;color:var(--muted);font-size:11.5px}
  .pb-total b{font:800 24px var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
  .pb-pay{min-height:52px;border-radius:12px;padding:0 22px;font-size:17px;font-weight:700}
  #toasts{bottom:calc(96px + env(safe-area-inset-bottom))}
}
@media (max-width:600px){
  .backdrop{align-items:flex-end;padding:0}
  .modal,.modal.wide{width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .modal-f{position:sticky;bottom:0;background:var(--surface)}
  .modal-f .btn{flex:1;justify-content:center}
}
@media (max-width:600px){
  .top{gap:10px;padding:0 10px}
  .brand b{display:none}
  .status #net{display:none}
  .pos-main{padding:10px 10px 104px;gap:10px}
  #q{min-height:52px;font-size:16px}
  .tiles{grid-auto-columns:minmax(128px,138px)}
  .ci{grid-template-columns:minmax(0,1fr) auto 44px;grid-template-areas:"main main x" "qty amt amt";row-gap:8px}
  .ci-i{display:none}
  .ci-main{grid-area:main}.ci-q{grid-area:qty}.ci-amt{grid-area:amt}.ci .icon-x{grid-area:x}
  .pb-total b{font-size:21px}
  .pb-pay{padding:0 16px}
}

const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let REGION='pk';try{REGION=localStorage.getItem('monext-region')||'pk'}catch(e){}

const CS=INTL?'$':'Rs ';

const moneyK=v=>{const m=(v||0)/SC;return m>=1000?(m/1000).toFixed(m>=10000?0:1).replace(/\.0$/,'')+'k':(INTL?m.toFixed(0):cnt(m))};

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ean(b){let s=0;for(let i=0;i<12;i++)s+=(+b[i])*(i%2?3:1);return b+((10-s%10)%10)}
const scaleCode=(code,grams)=>ean('21'+code+String(Math.round(grams)).padStart(5,'0'));
const EL=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EG=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const ER=EL.map(c=>c.replace(/./g,b=>b==='1'?'0':'1'));
const EP=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function eanSvg(code){
  if(!/^\d{13}$/.test(code))return '';
  const d=code.split('').map(Number),par=EP[d[0]];let bits='101';
  for(let i=1;i<=6;i++)bits+=(par[i-1]==='L'?EL:EG)[d[i]];bits+='01010';for(let i=7;i<=12;i++)bits+=ER[d[i]];bits+='101';
  const q=9,W=bits.length+q*2,guard=i=>i<3||(i>=45&&i<50)||i>=92;let r='';
  for(let i=0;i<bits.length;i++)if(bits[i]==='1')r+=`<rect x="${i+q}" y="0" width="1" height="${guard(i)?46:40}"/>`;
  return `<svg viewBox="0 0 ${W} 54" role="img" aria-label="Barcode ${code}"><rect width="${W}" height="54" fill="#fff"/><g fill="#000">${r}</g><g font-family="monospace" font-size="7.5" fill="#000"><text x="2" y="52">${code[0]}</text><text x="${q+3}" y="52" textLength="40">${code.slice(1,7)}</text><text x="${q+49}" y="52" textLength="40">${code.slice(7)}</text></g></svg>`}

function openModal(o){

  document.body.appendChild(bd);const m=bd.firstElementChild;stack.push({bd,o,prev:document.activeElement});

  m.addEventListener('click',e=>{if(e.target.closest('[data-m=x]'))closeModal()});

function promoCfg(){if(!S.promo)S.promo={mode:'none',globalPct:2,slabs:[],manualPinPct:5,rev:0};return S.promo}
function matchSlab(sub,P){const hits=(P.slabs||[]).filter(x=>x.pct>0&&sub>=x.min&&(x.max==null||sub<=x.max));return hits.sort((a,b)=>b.pct-a.pct||b.min-a.min)[0]||null}
function promoFor(sub,P){P=P||promoCfg();const none={mode:'none',pct:0,amount:0,label:''};if(!(sub>0))return none;
  if(P.mode==='global'){const pct=+P.globalPct||0;if(!(pct>0))return none;return {mode:'global',pct,amount:Math.min(sub,Math.round(sub*pct/100)),label:'Store discount '+fmtPct(pct),rev:P.rev}}
  if(P.mode==='slab'){const x=matchSlab(sub,P);if(!x)return none;return {mode:'slab',pct:x.pct,amount:Math.min(sub,Math.round(sub*x.pct/100)),slabId:x.id,label:`Slab ${slabRange(x)} · ${fmtPct(x.pct)}`,rev:P.rev}}
  return none}
function nextSlab(sub){const P=promoCfg();if(P.mode!=='slab')return null;const cur=promoFor(sub).pct;return (P.slabs||[]).filter(x=>x.pct>cur&&x.min>sub).sort((a,b)=>a.min-b.min)[0]||null}

function openReturn(){

        const key=l=>l.bid+l.pid+(l.uq||1),done=new Map();S.sales.filter(x=>x.kind==='return'&&x.ref===s.no).forEach(x=>x.lines.forEach(l=>done.set(key(l),(done.get(key(l))||0)+Math.abs(l.qty))));

        box.querySelector('#rOk').onclick=()=>{const lines=[];$$('[data-ri]',box).forEach(i=>{const v=+i.value;if(v>0){const l=s.lines[+i.dataset.ri];lines.push({...l,qty:-Math.min(v,+i.max)})}});if(!lines.length){toast('Enter a quantity to return','warn');return}closeModal(true);doReturn(s,lines,false)};

function doReturn(orig,lines,voidBy){
  const sh=SH();if(!sh){toast('Open a shift first','bad');return}
  const now=Date.now(),sub=lines.reduce((a,l)=>a+lineAmt(l),0),ratio=orig.sub?orig.total/orig.sub:1,total=Math.round(sub*ratio),pays={cash:0,raast:0,card:0,wallet:0,udhaar:0};
  if(orig.pays.udhaar&&orig.cust){const u=Math.max(total,-orig.pays.udhaar);pays.udhaar=u;pays.cash=total-u;const c=cust(orig.cust);c.bal+=u;S.custTx.push({id:uid(),cid:c.id,ts:now,type:'return',amount:u,note:'Return on '+orig.no})}else pays.cash=total;
  const r=mkSale({kind:'return',ref:orig.no,ts:now,lines,total,disc:0,pays,cust:orig.cust,cashier:me().name,shift:sh.id,counter:SESS.counter});r.synced=false;
  lines.forEach(l=>{const b=S.batches.find(x=>x.id===l.bid);if(b)b.qty=r3(b.qty-baseQty(l));S.moves.push({ts:now,pid:l.pid,bid:l.bid,qty:-baseQty(l),type:'return',ref:r.no})});
  S.sales.push(r);lastSale=r;if(voidBy)logRisk('void',Math.abs(total),`Bill ${orig.no} voided after printing`,voidBy);
  persist();scheduleSync();renderRail();showReceipt(r);toast(`Refund ${rs(Math.abs(pays.cash))} cash`+(pays.udhaar?` and ${rs(Math.abs(pays.udhaar))} back to khata`:''),'good')}

function fillGrnProduct(){const s=$('#g-p');if(!s||!s.value)return;const p=prod(s.value),b=fefo(p.id);$('#g-upc').value=p.upc;$('#g-tp').value=toMajor(b.cost*p.upc*1.02);$('#g-mrp').value=toMajor(curMrp(p.id));$('#g-exp').value=isoD(t0()+(p.cat==='Dairy'||p.cat==='Fresh'?20:p.cat==='Bakery'?3:365)*DAY)}
function grnAdd(){const v=id=>+$('#g-'+id).value||0,pid=$('#g-p').value;if(!pid)return;
  const l={pid,ct:v('ct'),upc:Math.max(1,v('upc')),tp:toMinor(v('tp')),dc:v('dc'),bp:v('bp'),br:v('br'),mrp:toMinor(v('mrp')),exp:$('#g-exp').value?new Date($('#g-exp').value+'T00:00').getTime():0,bn:$('#g-bn').value.trim()};

  toast(`Delivery saved. ${rs(net)} added to ${supShort(s)}`+(changes?` · ${changes} shelf label${changes>1?'s':''} to reprint`:'')+(claims?` · claim ${rs(claims)} raised`:''),'good')}

function shiftExpected(sh){const cash=S.sales.filter(s=>s.shift===sh.id).reduce((a,s)=>a+(s.pays.cash||0),0),ins=sh.moves.filter(m=>m.type==='in').reduce((a,m)=>a+m.amount,0),outs=sh.moves.filter(m=>m.type==='out').reduce((a,m)=>a+m.amount,0),
  kh=S.custTx.filter(t=>t.shift===sh.id&&t.type==='payment'&&t.method==='cash').reduce((a,t)=>a+t.amount,0);return {cash,ins,outs,kh,expected:Math.round(sh.float+cash+ins-outs+kh)}}
function guardScores(since,until){const m=new Map();S.users.filter(u=>u.role==='cashier').forEach(u=>m.set(u.name,{name:u.name,score:0,events:0,amount:0}));
  S.risks.filter(r=>r.ts>=since&&(!until||r.ts<until)).forEach(r=>{const g=m.get(r.cashier)||{name:r.cashier,score:0,events:0,amount:0};m.set(r.cashier,g);g.events++;g.amount+=r.amount;g.score+=RISK[r.type].w+(r.type==='shortage'?Math.round(r.amount/100*3):0)});
  return [...m.values()].map(g=>({...g,score:Math.min(100,g.score)})).sort((a,b)=>b.score-a.score)}

  <div class="cols">${card}${mgr?`<div class="panel"><div class="panel-h"><h2>Chori Guard</h2><span class="muted">Risk score out of 100, last 7 days</span></div><ul class="list">${g.map(x=>{const lv=x.score>=50?['High','bad']:x.score>=25?['Watch','warn']:['Normal','good'];return `<li><span style="flex:1"><b>${esc(x.name)}</b><span class="sub">${x.events} event${x.events===1?'':'s'} · ${rs(x.amount)} involved</span><div class="bar" style="margin-top:6px"><i class="${lv[1]==='good'?'':lv[1]}" style="width:${Math.max(2,x.score)}%"></i></div></span><span class="num" style="width:40px;text-align:right"><b>${x.score}</b></span><span class="chip ${lv[1]}">${lv[0]}</span></li>`}).join('')}</ul>

let rep={preset:'today',from:'',to:'',tab:'summary',counter:'all',cat:''};
const CSV={};

#dg .top button{margin-left:auto;background:none;border:0;color:#9fb8b1;font-size:18px;cursor:pointer;line-height:1;padding:2px 4px}
#dg .bar{height:3px;background:rgba(255,255,255,.12);border-radius:3px;margin:8px 14px 0;overflow:hidden}
#dg .bar i{display:block;height:100%;background:#b5f13f;transition:width .25s}
#dg .body{padding:10px 14px 4px}
#dg .body b{display:block;color:#fff;font-size:15px;margin-bottom:3px}
#dg .body em{font-style:normal;color:#b5f13f;font-weight:600}
#dg .nav{display:flex;gap:8px;padding:8px 14px 12px;align-items:center}
#dg .nav button{border:0;border-radius:8px;padding:7px 12px;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer}
#dg .back{background:rgba(255,255,255,.08);color:#dfeae6}
#dg .next{background:#b5f13f;color:#0c3525;margin-left:auto}
#dg .wa{display:block;margin:0 14px 12px;text-align:center;background:#b5f13f;color:#0c3525;text-decoration:none;font-weight:800;border-radius:9px;padding:9px;font-size:13px}
#dg .wa2{color:#b5f13f;font-size:12px;text-decoration:none;font-weight:600}
#dg.min .bar,#dg.min .body,#dg.min .nav,#dg.min .wa,#dg.min #dg-min{display:none}
#dg.min{left:0;bottom:auto;top:50%;transform:translateY(-50%);width:30px;height:132px;display:flex;align-items:center;justify-content:center;max-width:none;border-radius:0 10px 10px 0;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28);background:#b5f13f}
#dg.min .top{display:block;padding:14px 0}
#dg.min .top small{display:block;writing-mode:vertical-rl;transform:rotate(180deg);margin:0 auto;font-size:12px;letter-spacing:.1em;white-space:nowrap;color:#0c3525;font-weight:800}
/* keep the minimised DEMO GUIDE tab in its own lane so it never covers the bill */
body{box-sizing:border-box;padding-left:28px}
#dg.min{width:26px}
@media (max-width:700px){#dg:not(.min){left:8px;right:8px;bottom:8px;width:auto}}
</style>
<div id="dg" role="dialog" aria-label="Demo guide">
  <div class="top"><small id="dg-t">LIVE DEMO</small><button id="dg-min" title="Minimise">–</button></div>
  <div class="bar"><i id="dg-bar"></i></div>
  <div class="body" id="dg-body"></div>
  <div class="nav"><button class="back" id="dg-back">Back</button><a class="wa2" id="dg-wa2" href="https://wa.me/923089554795?text=Assalam%20o%20Alaikum%2C%20maine%20Monext%20POS%20ka%20demo%20dekha.%20Mujhe%20apni%20dukaan%20ke%20liye%20free%20demo%20%2F%20installation%20chahiye." target="_blank" rel="noopener">WhatsApp us</a><button class="next" id="dg-next">Next</button></div>
  <a class="wa" id="dg-wa" href="https://wa.me/923089554795?text=Assalam%20o%20Alaikum%2C%20maine%20Monext%20POS%20ka%20demo%20dekha.%20Mujhe%20apni%20dukaan%20ke%20liye%20free%20demo%20%2F%20installation%20chahiye." target="_blank" rel="noopener" hidden>Apni dukaan ke liye free demo · 0308 955 4795</a>
</div>
<script>
(function(){
  var STEPS=[["Login","Owner chunein, PIN <em>1111</em>. Owner dashboard khulega: aaj ki sale, asli munafa, galle ka cash."],["Barcode scan","Upar <em>Billing</em> kholein. Neeche <em>\"Try these barcodes\"</em> buttons asli scanner jaise hain: Olper's 1L, phir carton (12)."],["Khula maal","<em>Sugar</em> tile dabayein: \"Pao (250 g)\" ya \"Rs 100 ki cheeni\". Weight khud calculate hota hai."],["Anday","<em>Eggs</em> tile: 1 anda, darjan ya tray. Ek hi item, teen tareeqe."],["Auto discount","Bill Rs 3,000 se upar le jayein: discount khud lag jata hai. Rules sirf owner set karta hai."],["Payment","<em>Take payment</em> (F10): cash, Raast QR, card, JazzCash, udhaar ya split. Change khud."],["Chori Guard","Cart mein kisi item ka price kam karein: manager PIN (<em>1234</em>) maangta hai aur record ho jata hai."],["Owner ki nazar","<em>Owner</em>, <em>Reports</em>, <em>Udhaar</em>, <em>Stock</em>, <em>Suppliers</em> (claims) kholein."],["2 counters","Yehi link doosre tab mein kholein, C2 par login karein: dono counters saath chalte hain."]];
  var K='monext-demo-guide', st={i:0,min:false}; try{st=Object.assign(st,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
  var dg=document.getElementById('dg');
  function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
  function paint(){
    var n=STEPS.length,i=Math.max(0,Math.min(n,st.i)),last=i>=n;
    dg.classList.toggle('min',!!st.min);
    document.getElementById('dg-t').textContent=st.min?'DEMO GUIDE ▸':(last?'LIVE DEMO · DONE':'LIVE DEMO · STEP '+(i+1)+' OF '+n);
    document.getElementById('dg-min').textContent=st.min?'+':'–';
    document.getElementById('dg-bar').style.width=(Math.min(i,n)/n*100)+'%';
    document.getElementById('dg-body').innerHTML=last
      ?'<b>Yehi software aap ki dukaan mein</b>Windows PC par, barcode scanner, thermal printer aur cash drawer ke sath. Bina internet chalta hai, roz ka backup. Rs 50,000 ek baar + Rs 5,000 mahana support.'
      :'<b>'+STEPS[i][0]+'</b>'+STEPS[i][1];
    document.getElementById('dg-back').style.visibility=i>0?'visible':'hidden';
    document.getElementById('dg-next').textContent=last?'Start again':(i===n-1?'Finish':'Next');
    document.getElementById('dg-wa').hidden=!last; document.getElementById('dg-wa2').style.display=last?'none':'';
  }
  document.getElementById('dg-next').onclick=function(e){e.stopPropagation();st.i=st.i>=STEPS.length?0:st.i+1;save();paint()};
  document.getElementById('dg-back').onclick=function(e){e.stopPropagation();st.i=Math.max(0,st.i-1);save();paint()};
  document.getElementById('dg-min').onclick=function(e){e.stopPropagation();st.min=!st.min;save();paint()};
  dg.addEventListener('click',function(){if(st.min){st.min=false;save();paint()}});
  // Working in the POS (any click outside the guide) folds it into a small pill,
  // so it never sits on top of a button the visitor wants to press.
  document.addEventListener('pointerdown',function(e){if(!dg.contains(e.target)&&!st.min){st.min=true;save();paint()}},true);
  paint();
})();
</script>
</body>
</html>
